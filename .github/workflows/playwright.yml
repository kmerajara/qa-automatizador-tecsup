
name: Pruebas QA - Playwright

on:
  workflow_dispatch:

jobs:
  pruebas-qa:
    name: Ejecutar 8 pruebas QA
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        shell: cmd
        run: npm.cmd ci

      - name: Instalar Chromium
        shell: cmd
        run: npx.cmd playwright install chromium

      - name: Diagnosticar acceso HTTP
        shell: cmd
        continue-on-error: true
        run: |
          curl.exe -sS -L -o NUL -w "HTTP %%{http_code}\n" --max-time 20 https://practicesoftwaretesting.com/

      - name: Ejecutar 8 pruebas QA
        shell: cmd
        run: |
          npx.cmd playwright test tests/toolshop.spec.js --browser=chromium --workers=1

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-playwright-windows
          path: |
            diagnostico-catalogo.png
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
