name: Pruebas QA - Playwright

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  pruebas-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Diagnosticar acceso HTTP
        run: |
          curl -sS -L -o /dev/null -w "HTTP %{http_code}\n" --max-time 20 https://practicesoftwaretesting.com/

      - name: Ejecutar pruebas QA
        run: npx playwright test tests/toolshop.spec.js --browser=chromium --workers=1

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-playwright
          path: |
            diagnostico-catalogo.png
            test-results/
            playwright-report/
          if-no-files-found: warn
